# Nombre de la aplicación
spring.application.name=recetas

# Configuración de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/recetasdb
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.recetas=DEBUG

# Server
server.port=8080
server.error.whitelabel.enabled=false

# Spring MVC
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# Cookie settings
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# JWT Configuration
# Esta es una clave secreta generada aleatoriamente - NO USES ESTA EN PRODUCCIÓN
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=36000000
jwt.cookie.name=JWT-TOKEN

# Configuración para subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.path=src/main/resources/uploads

# Configuración de logs
logging.level.com.recetas.recetas=DEBUG

# Seguridad adicional
security.require-ssl=false