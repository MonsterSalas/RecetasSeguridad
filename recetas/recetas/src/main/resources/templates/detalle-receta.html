<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Detalle de Receta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .recipe-image {
            max-height: 400px;
            object-fit: cover;
            width: 100%;
        }

        .ingredients-list {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
        }

        .instructions {
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <!-- Título y metadata -->
                <h1 th:text="${receta.titulo}">Título de la Receta</h1>
                <div class="mb-3">
                    <span class="text-muted">
                        <i class="fas fa-user me-2"></i>
                        Por <span th:text="${receta.autor != null ? receta.autor.username : 'Anónimo'}"></span>
                    </span>
                    <span class="ms-3 text-muted">
                        <i class="fas fa-calendar me-2"></i>
                        <span th:text="${#temporals.format(receta.fechaCreacion, 'dd/MM/yyyy')}"></span>
                    </span>
                </div>

                <!-- Imágenes -->
                <div th:if="${receta.medias != null && !receta.medias.empty}" class="mb-4">
                    <div id="recetaCarousel" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner">
                            <div th:each="media, iterStat : ${receta.medias}"
                                th:class="${iterStat.first ? 'carousel-item active' : 'carousel-item'}">
                                <div th:if="${media.tipo == 'IMAGE'}">
                                    <img th:src="@{${media.url}}" class="d-block w-100 recipe-image"
                                        th:alt="${receta.titulo}">
                                </div>
                                <div th:if="${media.tipo == 'VIDEO'}" class="ratio ratio-16x9">
                                    <video th:src="@{${media.url}}" controls></video>
                                </div>
                            </div>
                        </div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#recetaCarousel"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#recetaCarousel"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon"></span>
                        </button>
                    </div>
                </div>

                <!-- Descripción -->
                <div class="mb-4" th:if="${receta.descripcion}">
                    <h4>Descripción</h4>
                    <p th:text="${receta.descripcion}"></p>
                </div>

                <!-- Ingredientes -->
                <div class="ingredients-list mb-4">
                    <h4>Ingredientes</h4>
                    <div th:utext="${#strings.replace(#strings.escapeXml(receta.ingredientes), '&#10;', '<br/>')}">
                    </div>
                </div>

                <!-- Instrucciones -->
                <div class="instructions mb-4">
                    <h4>Instrucciones</h4>
                    <div th:utext="${#strings.replace(#strings.escapeXml(receta.instrucciones), '&#10;', '<br/>')}">
                    </div>
                </div>

                <!-- Sección de valoraciones -->
                <div class="ratings mb-4">
                    <h4>Valoración</h4>
                    <div class="d-flex align-items-center mb-3">
                        <div class="h2 mb-0 me-2" th:text="${#numbers.formatDecimal(receta.promedioPuntuacion, 1, 1)}">
                            4.5</div>
                        <div class="stars">
                            <i class="fas fa-star text-warning"></i>
                            <span class="text-muted"
                                th:text="${receta.valoraciones != null ? receta.valoraciones.size() : 0} + ' valoraciones'"></span>
                        </div>
                    </div>

                    <!-- Formulario de valoración -->
                    <form th:if="${#authorization.expression('isAuthenticated()')}"
                        th:action="@{'/receta/' + ${receta.id} + '/valorar'}" method="post" class="mb-4">
                        <select name="puntuacion" class="form-select w-auto">
                            <option value="1">1 estrella</option>
                            <option value="2">2 estrellas</option>
                            <option value="3">3 estrellas</option>
                            <option value="4">4 estrellas</option>
                            <option value="5">5 estrellas</option>
                        </select>
                        <button type="submit" class="btn btn-primary mt-2">Valorar</button>
                    </form>
                </div>

                <!-- Sección de comentarios -->
                <div class="comments mt-5">
                    <h4>Comentarios</h4>

                    <!-- Formulario para añadir un comentario -->

                    <div class="card-footer">
                        <div id="error-mensaje" class="alert alert-danger mb-3" style="display: none;"></div>
                        <form id="comentarioForm" th:action="@{'/receta/' + ${receta.id} + '/comentar'}" method="post">
                            <div class="mb-3">
                                <label for="contenido" class="form-label">Comentario</label>
                                <textarea class="form-control" id="contenido" name="contenido" rows="3"
                                    required></textarea>
                            </div>
                            <input type="hidden" name="username" th:value="${#authentication.name}">
                            <button type="submit" class="btn btn-primary">Enviar Comentario</button>
                        </form>
                    </div>
                    <!-- Mensaje si el usuario no está autenticado -->
                    <div th:if="${!#authorization.expression('isAuthenticated()')}" class="alert alert-warning">
                        Debes <a th:href="@{/login}">iniciar sesión</a> para dejar un comentario.
                    </div>

                    <!-- Lista de comentarios -->
                    <div th:if="${receta.comentarios != null && !receta.comentarios.empty}" class="list-group mt-4">
                        <div th:each="comentario : ${receta.comentarios}" class="list-group-item">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="mb-0" th:text="${comentario.autor.username}">Nombre del Usuario</h6>
                                <small class="text-muted"
                                    th:text="${#temporals.format(comentario.fechaCreacion, 'dd/MM/yyyy HH:mm')}">
                                    Fecha del comentario
                                </small>
                            </div>
                            <p class="mb-1" th:text="${comentario.contenido}">Contenido del comentario</p>
                        </div>
                    </div>

                    <!-- Mensaje si no hay comentarios -->
                    <div th:if="${receta.comentarios == null || receta.comentarios.empty}" class="text-muted mt-3">
                        No hay comentarios aún. ¡Sé el primero en comentar!
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="col-md-4">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h5>Compartir Receta</h5>
                            <div class="d-flex gap-2">
                                <a th:href="'https://twitter.com/intent/tweet?text=' + ${receta.titulo} + '&url=' + ${receta.compartirUrl}"
                                    class="btn btn-outline-primary" target="_blank">
                                    <i class="fab fa-twitter"></i>
                                </a>
                                <a th:href="'https://www.facebook.com/sharer/sharer.php?u=' + ${receta.compartirUrl}"
                                    class="btn btn-outline-primary" target="_blank">
                                    <i class="fab fa-facebook"></i>
                                </a>
                                <button class="btn btn-outline-primary"
                                    onclick="navigator.clipboard.writeText(window.location.href)">
                                    <i class="fas fa-link"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
    document.getElementById('comentarioForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const form = this;
        const contenido = document.getElementById('contenido').value;

        fetch(form.action, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams(new FormData(form))
        })
            .then(data => {
                if (data.error) {
                    document.getElementById('error-mensaje').textContent = data.error;
                    document.getElementById('error-mensaje').style.display = 'block';
                } else {
                    window.location.href = window.location.pathname + '?success=true';
                    // Alternative: window.location.reload();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('error-mensaje').textContent = 'Error al enviar el comentario';
                document.getElementById('error-mensaje').style.display = 'block';
            });
    });
</script>

</html>
