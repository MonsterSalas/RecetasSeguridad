<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Crear Receta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-plus-circle me-2"></i>Crear Nueva Receta</h2>
                    </div>
                    <div class="card-body">
                        <!-- Mensaje de error si existe -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            Hubo un error al crear la receta. Por favor intenta nuevamente.
                        </div>

                        <form th:action="@{/receta/crear}" method="post" enctype="multipart/form-data" th:object="${receta}">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título *</label>
                                <input type="text" class="form-control" id="titulo" name="titulo" 
                                       th:field="*{titulo}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" 
                                          th:field="*{descripcion}" rows="3"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="ingredientes" class="form-label">Ingredientes</label>
                                <textarea class="form-control" id="ingredientes" name="ingredientes" 
                                          th:field="*{ingredientes}" rows="5"
                                          placeholder="- Ingrediente 1&#10;- Ingrediente 2"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="instrucciones" class="form-label">Instrucciones</label>
                                <textarea class="form-control" id="instrucciones" name="instrucciones" 
                                          th:field="*{instrucciones}" rows="5"
                                          placeholder="1. Paso 1&#10;2. Paso 2"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="archivos" class="form-label">Fotos y Videos</label>
                                <input type="file" class="form-control" id="archivos" name="archivos" 
                                       multiple accept="image/*,video/*">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Guardar Receta
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
